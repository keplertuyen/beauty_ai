<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Syntheprise Framework Status Dashboard</title>
<style>
:root{color-scheme:light}
body{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;margin:0;background:#f6f7f9;color:#1c2530}
header{background:#0f2436;color:#fff;padding:20px 28px}
header h1{margin:0;font-size:20px} header p{margin:4px 0 0;color:#9fb3c8;font-size:12px}
main{padding:24px 28px;max-width:980px;margin:0 auto}
.cards{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.card{background:#fff;border:1px solid #e3e8ee;border-radius:10px;padding:16px 18px;flex:1;min-width:170px}
.card .n{font-size:28px;font-weight:700} .card .l{color:#5b6b7b;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #e3e8ee;border-radius:10px;overflow:hidden}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #eef1f4;font-size:14px}
th{background:#f0f3f6;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:#5b6b7b}
.bar{display:inline-block;width:120px;height:8px;background:#e3e8ee;border-radius:5px;overflow:hidden;vertical-align:middle;margin-right:8px}
.bar span{display:block;height:100%;background:#2f8f5b}
.muted{color:#9aa7b4} h2{font-size:15px;margin:26px 0 10px} ul{padding-left:18px}
</style></head><body>
<header><h1>Syntheprise Framework Status Dashboard</h1><p>Generated by <code>syntheprise dashboard</code> · 2026-10-25 09:51 UTC</p></header>
<main>
<div class="cards">
  <div class="card"><div class="n">0</div><div class="l">Active changes</div></div>
  <div class="card"><div class="n">0</div><div class="l">Archived</div></div>
  <div class="card"><div class="n">100%</div><div class="l">Must-FR test coverage</div></div>
  <div class="card"><div class="n">25/25</div><div class="l">FR with test</div></div>
</div>
<h2>Active changes</h2>
<table><thead><tr><th>Change</th><th>Tasks</th><th>Done</th><th>Parallel [P]</th><th>Progress</th></tr></thead>
<tbody><tr><td colspan='5' class='muted'>No active changes</td></tr></tbody></table>
<h2>Archived changes</h2><ul><li class='muted'>none</li></ul>
</main></body></html>
